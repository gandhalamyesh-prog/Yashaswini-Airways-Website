<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Yashaswini Airways - Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        ✈ Yashaswini Airways
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="flights.html">
            Flights
        </a>

        <a href="booking.html">
            Booking
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="login.html"
           class="active">
            Login
        </a>

    </nav>

</header>



<!-- ================= LOGIN SECTION ================= -->

<section class="login-section">


    <div class="login-box">


        <h1>
            Welcome Back ✈
        </h1>


        <p>
            Login to Yashaswini Airways
        </p>



        <!-- LOGIN FORM -->

        <form onsubmit="loginUser(event)">


            <!-- EMAIL -->

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >



            <!-- PASSWORD -->

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >



            <!-- LOGIN BUTTON -->

            <button type="submit">
                Login
            </button>


        </form>



        <!-- MESSAGE -->

        <p id="loginMessage"></p>



        <p class="login-note">

            New passenger?
            Login using your email
            and password.

        </p>


    </div>


</section>



<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 Yashaswini Airways.
        All Rights Reserved.
    </p>

</footer>



<!-- ================= LOGIN JAVASCRIPT ================= -->

<script>

function loginUser(event) {

    event.preventDefault();


    /* Get email and password */

    let email =
        document.getElementById("email").value.trim();

    let password =
        document.getElementById("password").value.trim();

    let message =
        document.getElementById("loginMessage");


    /* Check fields */

    if (email === "" || password === "") {

        message.innerHTML =
            "⚠️ Please enter email and password.";

        message.style.color = "red";

        return;

    }


    /* ================= SAVE LOGIN ================= */

    localStorage.setItem(
        "yashaswiniLoggedIn",
        "true"
    );


    localStorage.setItem(
        "yashaswiniUserEmail",
        email
    );


    /* ================= SUCCESS MESSAGE ================= */

    message.innerHTML =
        "✅ Login Successful! Redirecting to Home...";

    message.style.color = "green";


    /* ================= REDIRECT TO HOME ================= */

    setTimeout(function() {

        window.location.href =
            "index.html";

    }, 1000);

}

</script>


</body>

</html>
